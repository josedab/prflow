services:
  postgres:
    image: postgres:16-alpine
    container_name: prflow-postgres
    environment:
      POSTGRES_USER: prflow
      POSTGRES_PASSWORD: prflow
      POSTGRES_DB: prflow
    ports:
      - "${PRFLOW_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prflow-redis
    ports:
      - "${PRFLOW_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
